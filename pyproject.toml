[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presend"
version = "0.1.0"
description = "Check a recipient against your own on-chain history before you pay. Powered by the Blockscout PRO API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
mcp = ["mcp>=1.10"]
test = ["pytest>=8", "mcp>=1.10"]

[project.scripts]
presend = "presend.cli:main"
presend-mcp = "presend.mcp_server:main"

[tool.setuptools]
packages = ["presend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
